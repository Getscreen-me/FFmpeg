name: Sync selected branches to GitLab

on:
  push:
    branches:
      - master
    tags:
      - 'n*'
  workflow_dispatch:

jobs:
  sync:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure GitLab remote
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git remote remove gitlab 2>/dev/null || true
          git remote add gitlab https://oauth2:${GITLAB_TOKEN}@gitlab.jointhub.ru/joint/ffmpeg.git

      - name: Push selected branches
        shell: bash
        run: |
          set -e

          for branch in master; do
            if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
              echo "Pushing branch: $branch"
              git push gitlab "refs/remotes/origin/$branch:refs/heads/$branch"
            else
              echo "Branch $branch not found in origin, skipping"
            fi
          done

      - name: Push selected tags
        run: |
          set -e

          # при пуше тега берём его из события, иначе список по умолчанию
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tags="${{ github.ref_name }}"
          else
            tags="n9.0"
          fi

          for tag in $tags; do
            if git show-ref --verify --quiet "refs/tags/$tag"; then
              echo "Pushing tag: $tag"
              git push gitlab "refs/tags/$tag:refs/tags/$tag"
            else
              echo "Tag $tag not found, skipping"
            fi
          done