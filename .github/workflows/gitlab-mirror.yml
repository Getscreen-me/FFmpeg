name: Sync selected branches to GitLab

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  sync:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure GitLab remote
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git remote remove gitlab 2>/dev/null || true
          git remote add gitlab https://oauth2:${GITLAB_TOKEN}@gitlab.jointhub.ru/joint/ffmpeg.git

      - name: Push selected branches
        shell: bash
        run: |
          set -e

          for branch in master develop pre-release; do
            if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
              echo "Pushing branch: $branch"
              git push gitlab "refs/remotes/origin/$branch:refs/heads/$branch"
            else
              echo "Branch $branch not found in origin, skipping"
            fi
          done